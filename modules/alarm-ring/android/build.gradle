apply plugin: 'com.android.library'

group = 'expo.modules.alarmring'

def safeExtGet(name, fallback) {
  if (rootProject.ext.has(name)) {
    return rootProject.ext.get(name)
  }
  return fallback
}

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

dependencies {
    // AppCompatDelegate.setDefaultNightMode：皮肤偏好同步夜间模式（008 深色模式），
    // 与 app 壳层 ReactActivity 的 appcompat 版本由 Gradle 取高者对齐
    implementation "androidx.appcompat:appcompat:1.7.0"
}

android {
  namespace "alarm.ring"
  compileSdkVersion safeExtGet("compileSdkVersion", 36)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 36)
  }

  publishing {
    singleVariant("release") {
      withSourcesJar()
    }
  }
}
