<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Alarm App · 能力扩展原型</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;color:#25223a;background:#f7f5fc}*{box-sizing:border-box}body{margin:0;padding:28px;background:linear-gradient(145deg,#f7f5fc,#eeeafd)}button,input{font:inherit}button{border:0;cursor:pointer}.shell{max-width:1120px;margin:auto}.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:18px}.eyebrow{color:#6c5ce7;letter-spacing:.14em;font-size:11px;font-weight:800;text-transform:uppercase}h1{margin:7px 0;font-size:clamp(25px,4vw,40px);letter-spacing:-.05em}.intro p{max-width:650px;margin:0;color:#6d6880;font-size:13px;line-height:1.6}.source{display:inline-flex;margin:9px 0 20px;padding:8px 11px;border:1px solid #e5e1f0;border-radius:99px;background:#fff;color:#5545c8;text-decoration:none;font-size:11px}.toolbar{display:flex;gap:4px;padding:4px;border-radius:14px;background:#ebe6fa}.toolbar button{padding:9px 11px;border-radius:10px;background:transparent;color:#6d6880;font-size:12px;font-weight:700}.toolbar button.active{background:#fff;color:#5545c8;box-shadow:0 4px 12px #51468a18}.stage{display:grid;grid-template-columns:340px 1fr;gap:22px}.phone{max-width:340px;padding:10px;border-radius:31px;background:#28243a;box-shadow:0 22px 50px #51468a27}.screen{min-height:700px;padding:22px 16px;border-radius:24px;background:#f7f5fc;overflow:hidden}.status{display:flex;justify-content:space-between;margin-bottom:24px;color:#9c97ac;font-size:10px}.nav{display:flex;justify-content:space-between;align-items:center}.nav h2{margin:0;font-size:25px;letter-spacing:-.05em}.nav small{display:block;margin-top:5px;color:#6d6880;font-size:10px}.icon{width:30px;height:30px;border-radius:10px;background:#eae6ff;color:#6c5ce7}.search{width:100%;padding:11px 13px;margin:17px 0 8px;border:0;border-radius:13px;background:#ebe6fa;color:#25223a;outline:0}.chips{display:flex;gap:5px;overflow:hidden;margin-bottom:9px}.chip{flex:0 0 auto;padding:7px 9px;border:1px solid #e5e1f0;border-radius:9px;background:#fff;color:#6d6880;font-size:9px}.chip.active{border-color:#6c5ce7;background:#eae6ff;color:#5545c8}.card{display:flex;gap:10px;align-items:center;padding:13px;margin:8px 0;border:1px solid #e5e1f0;border-radius:16px;background:#fff;box-shadow:0 7px 14px #51468a0d}.bar{width:4px;height:52px;border-radius:4px;background:#6c5ce7}.bar.red{background:#e85d75}.bar.orange{background:#e79a4d}.bar.green{background:#45b89c}.copy{flex:1}.time{color:#5545c8;font-size:20px;font-weight:800}.label{margin-top:3px;color:#25223a;font-size:12px;font-weight:800}.meta{margin-top:3px;color:#9c97ac;font-size:9px}.next{margin-top:4px;color:#6c5ce7;font-size:9px}.card button{padding:7px 8px;border-radius:9px;background:#eae6ff;color:#5545c8;font-size:9px}.expired{background:#faf9fd;color:#9c97ac}.expired .time,.expired .label{color:#9c97ac;text-decoration:line-through}.expired .next{color:#9c97ac}.section{padding:14px;margin-top:10px;border:1px solid #e5e1f0;border-radius:16px;background:#fff}.section h3{margin:0;font-size:14px}.section p{margin:6px 0;color:#6d6880;font-size:11px;line-height:1.5}.categories{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.category{padding:8px 10px;border:1px solid #e5e1f0;border-radius:10px;color:#6d6880;background:#faf9fd;font-size:10px}.category.active{border-color:#6c5ce7;background:#eae6ff;color:#5545c8}.dot{display:inline-block;width:7px;height:7px;margin-right:5px;border-radius:50%;background:#6c5ce7}.dot.red{background:#e85d75}.dot.orange{background:#e79a4d}.dot.green{background:#45b89c}.alert{padding:14px;border:1px solid #f0d6a8;border-radius:15px;background:#fff8e9}.alert strong{color:#ad6b21;font-size:13px}.alert p{margin:7px 0;color:#80613d;font-size:11px;line-height:1.5}.actions{display:flex;gap:7px}.actions button{flex:1;padding:10px;border-radius:10px;background:#eae6ff;color:#5545c8;font-size:10px}.actions .primary{background:#6c5ce7;color:#fff}.empty{padding:70px 16px;text-align:center;color:#9c97ac;font-size:11px}.notes{padding:20px;border-radius:20px;background:#fff;border:1px solid #e5e1f0}.notes h3{margin:0 0 10px;font-size:16px}.notes p,.notes li{color:#6d6880;font-size:12px;line-height:1.7}.notes ul{padding-left:20px}.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#eae6ff;color:#5545c8;font-size:10px;font-weight:800}@media(max-width:760px){body{padding:16px 10px}.intro{display:block}.toolbar{margin-top:14px}.stage{grid-template-columns:1fr}.phone{margin:auto}.notes{display:none}}
  </style>
</head>
<body>
  <main class="shell"><header class="intro"><div><div class="eyebrow">Alarm App / capability prototype</div><h1>Eva 能力扩展</h1><p>验证分类、快速复制、一次性过期状态和冲突检测如何进入现有闹钟流程。点击顶部页面查看不同状态。</p></div><div class="toolbar"><button class="active" data-page="list">列表</button><button data-page="category">分类</button><button data-page="conflict">冲突提示</button><button data-page="expired">已过期</button></div></header><a class="source" href="https://github.com/akveo/react-native-ui-kitten" target="_blank">开源视觉来源：Eva / UI Kitten · MIT ↗</a><section class="stage"><div class="phone"><div class="screen" id="screen"></div></div><aside class="notes"><span class="badge">当前实现范围</span><h3>P0 / P1 交互验证</h3><p>原型和当前代码保持一致，保留本地优先和非阻断提示。</p><ul><li>列表支持搜索、类型/分类筛选和排序</li><li>复制保留规则和分类，一次性日期改为明天</li><li>过去的一次性提醒显示已过期</li><li>同一分钟冲突提示后仍可继续保存</li></ul></aside></section></main>
  <script>
    const state={page:'list',filter:'全部'};const data=[{time:'07:30',label:'早班提醒',meta:'家庭 · 每天',next:'下次：明天',c:'red'},{time:'09:00',label:'站会提醒',meta:'工作 · 每周',next:'下次：周一',c:''},{time:'18:30',label:'晚间运动',meta:'运动 · 周期',next:'下次：10月5日',c:'green'},{time:'21:00',label:'阅读时间',meta:'生活 · 一次',next:'已过期',c:'orange',expired:true}];
    function top(sub){return `<div class="status"><span>9:41</span><span>▮▮▮ ▰</span></div><div class="nav"><div><h2>我的闹钟</h2><small>${sub}</small></div><button class="icon">⋯</button></div>`}
    function card(x){return `<div class="card ${x.expired?'expired':''}"><i class="bar ${x.c}"></i><div class="copy"><div class="time">${x.time}</div><div class="label">${x.label}</div><div class="meta">${x.meta}</div><div class="next">${x.next}</div></div>${x.expired?'<button data-page="expired">编辑</button>':'<button>复制</button>'}</div>`}
    function list(){return `${top('4 个提醒 · 本地优先')}<input class="search" placeholder="搜索提醒名称"/><div class="chips">${['全部','一次','每天','每周','周期'].map(x=>`<button class="chip ${state.filter===x?'active':''}" data-filter="${x}">${x}</button>`).join('')}</div>${data.map(card).join('')}<div class="section"><p>排序：下次响铃时间　⌄</p></div>`}
    function category(){return `${top('给提醒加上容易识别的颜色')}<div class="section"><h3>分类设置</h3><p>预设分类会同步显示在列表、日历和编辑页。</p><div class="categories">${[['工作',''],['家庭','red'],['生活','orange'],['运动','green'],['其他','']].map((x,i)=>`<button class="category ${i===1?'active':''}"><i class="dot ${x[1]}"></i>${x[0]}</button>`).join('')}</div></div><div class="section"><h3>示例预览</h3>${card(data[0])}</div><button class="actions primary" style="width:100%;margin-top:12px;padding:11px;border-radius:11px;background:#6c5ce7;color:#fff">保存分类</button>`}
    function conflict(){return `${top('保存前检查未来 30 天')}<div class="alert"><strong>发现时间冲突</strong><p>“早班提醒”和“站会提醒”会在周一 09:00 同时响铃。你可以返回修改，或继续保存。</p><div class="actions"><button>返回修改</button><button class="primary">仍然保存</button></div></div><div class="section"><h3>检测规则</h3><p>按同一天、同一分钟比较一次性、每天、每周和周期提醒，周期跳过记录会被排除。</p></div>`}
    function expired(){return `${top('一次性提醒 · 计划日期已过去')}<div class="section">${card(data[3])}<p>计划日期过去后显示“已过期”，提醒仍可编辑日期、重新启用或删除。</p><div class="actions"><button>改日期</button><button class="primary">重新启用</button></div></div><div class="empty">历史提醒会保留在日历中，方便回看。</div>`}
    function render(){screen.innerHTML=state.page==='list'?list():state.page==='category'?category():state.page==='conflict'?conflict():expired();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;sync();render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()})}function sync(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page))}render();
  </script>
</body>
</html>
