<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alarm App · 日历视图原型</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;color:#25223a;background:#f7f5fc}*{box-sizing:border-box}body{margin:0;padding:28px;background:linear-gradient(145deg,#f7f5fc,#eeeafd)}button{font:inherit;cursor:pointer;border:0}.shell{max-width:1120px;margin:auto}.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:18px}.eyebrow{color:#6c5ce7;letter-spacing:.14em;font-size:11px;font-weight:800;text-transform:uppercase}h1{margin:7px 0;font-size:clamp(25px,4vw,40px);letter-spacing:-.05em}.intro p{max-width:650px;margin:0;color:#6d6880;font-size:13px;line-height:1.6}.source{display:inline-flex;margin:9px 0 20px;padding:8px 11px;border:1px solid #e5e1f0;border-radius:99px;background:#fff;color:#5545c8;text-decoration:none;font-size:11px}.toolbar{display:flex;gap:4px;padding:4px;border-radius:14px;background:#ebe6fa}.toolbar button{padding:9px 13px;border-radius:10px;background:transparent;color:#6d6880;font-size:12px;font-weight:700}.toolbar button.active{background:#fff;color:#5545c8;box-shadow:0 4px 12px #51468a18}.stage{display:grid;grid-template-columns:340px 1fr;gap:22px;align-items:start}.phone{max-width:340px;padding:10px;border-radius:31px;background:#28243a;box-shadow:0 22px 50px #51468a27}.screen{min-height:700px;padding:22px 16px;border-radius:24px;background:#f7f5fc;overflow:hidden}.status{display:flex;justify-content:space-between;margin-bottom:24px;color:#9c97ac;font-size:10px}.nav{display:flex;justify-content:space-between;align-items:center}.nav h2{margin:0;font-size:25px;letter-spacing:-.05em}.nav small{display:block;margin-top:5px;color:#6d6880;font-size:10px}.nav-actions{display:flex;gap:6px}.icon{width:30px;height:30px;border-radius:10px;background:#eae6ff;color:#6c5ce7}.seg{display:flex;gap:3px;margin:18px 0 12px;padding:4px;border-radius:13px;background:#ebe6fa}.seg button{flex:1;padding:8px 1px;border-radius:9px;background:transparent;color:#6d6880;font-size:10px}.seg button.active{background:#fff;color:#5545c8;box-shadow:0 3px 8px #51468a16}.range{display:flex;justify-content:space-between;align-items:center;margin:10px 0 12px}.range strong{font-size:14px}.range button{width:28px;height:28px;border-radius:9px;background:#fff;color:#6c5ce7;border:1px solid #e5e1f0}.calendar{padding:9px;border:1px solid #e5e1f0;border-radius:17px;background:#fff}.weekdays,.month{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.weekdays span{text-align:center;color:#9c97ac;font-size:9px;font-weight:700;padding:4px 0}.day{min-height:48px;padding:4px;border-radius:9px;background:#faf9fd;color:#6d6880;font-size:10px}.day.out{color:#c1bdc9;background:#fff}.day.selected{background:#6c5ce7;color:#fff}.day.today{border:1px solid #6c5ce7}.dots{display:flex;gap:2px;margin-top:6px}.dot{width:5px;height:5px;border-radius:5px;background:#6c5ce7}.dot.green{background:#45b89c}.dot.orange{background:#e79a4d}.detail{margin-top:13px;padding-top:12px;border-top:1px solid #e5e1f0}.detail-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.detail-head strong{font-size:13px}.detail-head span{color:#9c97ac;font-size:10px}.event{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #f0edf5}.event:last-child{border-bottom:0}.event-bar{width:4px;height:34px;border-radius:4px;background:#6c5ce7}.event-bar.green{background:#45b89c}.event-copy{flex:1}.event-time{color:#5545c8;font-size:11px;font-weight:800}.event-label{margin-top:2px;color:#25223a;font-size:11px;font-weight:700}.event-type{margin-top:2px;color:#9c97ac;font-size:9px}.timeline{display:grid;grid-template-columns:34px 1fr;gap:8px;max-height:530px;overflow:hidden;border:1px solid #e5e1f0;border-radius:17px;background:#fff}.hours{padding-top:4px}.hours span{display:block;height:54px;padding:6px 4px 0 0;color:#9c97ac;font-size:9px;text-align:right}.columns{display:grid;grid-template-columns:repeat(var(--days),1fr)}.column{min-width:0;border-left:1px solid #f0edf5}.col-head{height:34px;padding:7px 2px;color:#5545c8;font-size:9px;text-align:center;font-weight:800;border-bottom:1px solid #e5e1f0}.hour{height:54px;padding:3px;border-bottom:1px solid #f5f2f8}.block{padding:6px;border-radius:8px;background:#eae6ff;color:#5545c8;font-size:9px;font-weight:800}.block.green{background:#def4ed;color:#27846d}.block.orange{background:#fff0de;color:#ad6b21}.empty{padding:65px 15px;text-align:center;color:#9c97ac;font-size:11px}.notes{padding:20px;border-radius:20px;background:#fff;border:1px solid #e5e1f0}.notes h3{margin:0 0 10px;font-size:16px}.notes p{margin:8px 0;color:#6d6880;font-size:12px;line-height:1.65}.notes ul{margin:12px 0 0;padding-left:20px;color:#6d6880;font-size:12px;line-height:1.9}.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#eae6ff;color:#5545c8;font-size:10px;font-weight:800}@media(max-width:760px){body{padding:16px 10px}.intro{display:block}.toolbar{margin-top:14px}.stage{grid-template-columns:1fr}.phone{margin:auto}.notes{display:none}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="intro"><div><div class="eyebrow">Alarm App / calendar prototype</div><h1>Eva 日历视图</h1><p>沿用当前已确认的 Eva / UI Kitten 风格，验证月、周、三天、单天四种提醒分布方式。点击顶部视图、日期和前后翻页查看交互。</p></div><div class="toolbar" role="tablist"><button class="active" data-mode="month">月</button><button data-mode="week">周</button><button data-mode="three">3天</button><button data-mode="day">日</button></div></header>
    <a class="source" href="https://github.com/akveo/react-native-ui-kitten" target="_blank">开源视觉来源：Eva / UI Kitten · MIT ↗</a>
    <section class="stage"><div class="phone"><div class="screen" id="screen"></div></div><aside class="notes"><span class="badge">已确认设计决策</span><h3>日历原型覆盖</h3><p>日历只展示计划实例，日期计算复用现有四种闹钟规则和周期调整。</p><ul><li>月视图看整月分布，点击日期展开详情</li><li>周 / 三天视图按小时排列实例</li><li>单天视图聚焦当天执行列表</li><li>默认隐藏暂停提醒，可打开筛选</li></ul></aside></section>
  </main>
  <script>
    const state={mode:'month',offset:0,selected:15};
    const days=['一','二','三','四','五','六','日'];
    const events=[{d:15,t:'07:30',label:'晨间服药',type:'每天',c:''},{d:15,t:'09:00',label:'站会提醒',type:'每周',c:'green'},{d:17,t:'18:30',label:'运动',type:'周期',c:'orange'},{d:19,t:'21:00',label:'阅读时间',type:'每天',c:'green'}];
    function header(title,sub){return `<div class="status"><span>9:41</span><span>▮▮▮ ▰</span></div><div class="nav"><div><h2>日历</h2><small>${sub}</small></div><div class="nav-actions"><button class="icon">⌕</button><button class="icon">⋯</button></div></div><div class="seg">${[['month','月'],['week','周'],['three','3天'],['day','日']].map(x=>`<button data-mode="${x[0]}" class="${state.mode===x[0]?'active':''}">${x[1]}</button>`).join('')}</div><div class="range"><button data-move="-1">‹</button><strong>${title}</strong><button data-move="1">›</button></div>`}
    function eventCard(e){return `<div class="event"><i class="event-bar ${e.c}"></i><div class="event-copy"><div class="event-time">${e.t}</div><div class="event-label">${e.label}</div><div class="event-type">${e.type}</div></div></div>`}
    function month(){let cells='';for(let i=1;i<=42;i++){const n=((i+13)%31)+1;const list=events.filter(e=>e.d===n);cells+=`<button class="day ${i<5?'out ':''}${n===state.selected?'selected ':''}${n===15?'today':''}" data-day="${n}">${n}<div class="dots">${list.slice(0,3).map(e=>`<i class="dot ${e.c}"></i>`).join('')}</div></button>`}return `${header('2026年10月','月视图 · 4 个提醒')}<div class="calendar"><div class="weekdays">${days.map(d=>`<span>${d}</span>`).join('')}</div><div class="month">${cells}</div><div class="detail"><div class="detail-head"><strong>10月${state.selected}日的提醒</strong><span>${events.filter(e=>e.d===state.selected).length} 项</span></div>${events.filter(e=>e.d===state.selected).map(eventCard).join('')||'<div class="empty">这一天没有提醒</div>'}</div></div>`}
    function timeline(count){return `<div class="timeline" style="--days:${count}"><div class="hours">${Array.from({length:10},(_,i)=>`<span>${String(i+7).padStart(2,'0')}:00</span>`).join('')}</div><div class="columns">${Array.from({length:count},(_,i)=>`<div class="column"><div class="col-head">${days[(i+1)%7]} ${15+i}</div>${Array.from({length:10},(_,h)=>`<div class="hour">${h===0&&i===0?'<div class="block">07:30 晨间服药</div>':''}${h===2&&i===1?'<div class="block green">09:00 站会</div>':''}${h===5&&i===2?'<div class="block orange">12:30 运动</div>':''}</div>`).join('')}</div>`).join('')}</div></div>`}
    function render(){const sub=state.mode==='day'?'单天聚焦 · 2 个提醒':state.mode==='week'?'周一至周日 · 4 个提醒':state.mode==='three'?'今天至后天 · 2 个提醒':'整月分布 · 4 个提醒';if(state.mode==='month')screen.innerHTML=month();else if(state.mode==='day')screen.innerHTML=`${header('10月15日','周四 · 2 个提醒')}<div class="detail" style="padding:12px;border:1px solid #e5e1f0;border-radius:17px;background:#fff">${events.filter(e=>e.d===15).map(eventCard).join('')}</div>`;else screen.innerHTML=`${header(state.mode==='week'?'10月12日 - 18日':'10月15日 - 17日',sub)}${timeline(state.mode==='week'?7:3)}`;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;sync();render()});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{state.selected=Number(b.dataset.day);render()});document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{state.offset+=Number(b.dataset.move);render()})}
    function sync(){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode))}render();
  </script>
</body>
</html>
